# GPU smoke test: baselines (EvoEdit, NSE, RECT-Aligned)
# Launch: sky launch sky/test_baseline_runners.yaml --cluster test-baseline --detach-run -y
# ~10 min on L40S

resources:
  accelerators: L40s:1
  cpus: 4+
  memory: 16+

workdir: .

file_mounts:
  ~/sky_workdir/.env: ./.env

setup: |
  set -euo pipefail
  cd ~/sky_workdir
  bash scripts/remote_setup.sh

run: |
  set -euo pipefail
  cd ~/sky_workdir
  set -a && source ~/.env 2>/dev/null || source ~/sky_workdir/.env && set +a
  export RESULT_ROOT="/s3-data/continual-learning/alphaedit/results/_smoke_test/baseline"
  export CHECKPOINT_ROOT="/s3-data/continual-learning/alphaedit/checkpoints/_smoke_test/baseline"

  bash scripts/link_stats.sh
  bash scripts/link_dsets.sh
  uv run python scripts/patches/apply_all.py

  echo "=== CPU tests ==="
  uv run pytest tests/test_path_isolation.py tests/test_all_runners.py \
      tests/test_patches.py tests/test_patch_integration.py \
      tests/test_integration_cpu.py --tb=short -q

  echo ""
  echo "=== GPU: Baselines (EvoEdit, NSE, RECT) ==="
  SMOKE_TIMEOUT=900 bash tests/test_smoke_all_algorithms.sh --skypilot EvoEdit NSE RECT
