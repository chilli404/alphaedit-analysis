resources:
  accelerators: L40S:1
  cpus: 2+
  memory: 16+

workdir: .

run: |
  cd ~/sky_workdir
  export RESULT_ROOT="/s3-data/continual-learning/alphaedit/results"
  export CHECKPOINT_ROOT="/s3-data/continual-learning/alphaedit/checkpoints"
  export KEYS_PATH="$RESULT_ROOT/key_vectors/full_mcf/keys_seed42_layer6.npz"
  export MODEL_NAME="${MODEL_NAME:-meta-llama/Meta-Llama-3-8B-Instruct}"

  bash scripts/link_stats.sh
  bash scripts/link_dsets.sh
  uv run python scripts/patches/apply_all.py

  # Verify stats linked
  ls -la vendor/AlphaEdit/data/stats/Llama3-8B/wikipedia_stats/*.npz | head -2 || echo "WARNING: stats not linked"

  # MEMIT's get_cov() uses model._name_or_path which resolves to the S3 path.
  # Create symlinks for all possible model-name variants.
  for variant in \
    _s3-data_continual-learning_models_Meta-Llama-3-8B \
    meta-llama_Meta-Llama-3-8B-Instruct \
    meta-llama_Meta-Llama-3-8B-Instruct; do
    ln -sf Llama3-8B "vendor/AlphaEdit/data/stats/${variant}" 2>/dev/null || true
  done

  bash scripts/run_logit_damage_memit.sh ${SEED:-42} \
    --lambda_prev ${LAMBDA_PREV:-1.0} \
    --lambda_delta ${LAMBDA_DELTA:-0.0}
