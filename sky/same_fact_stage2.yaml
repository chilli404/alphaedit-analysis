resources:
  accelerators: L40S:1
  cpus: 2+
  memory: 16+

workdir: .

run: |
  cd ~/sky_workdir
  export RESULT_ROOT="/s3-data/continual-learning/alphaedit/results"
  export CHECKPOINT_ROOT="/s3-data/continual-learning/alphaedit/checkpoints"
  export KEYS_PATH="$RESULT_ROOT/key_vectors/full_mcf/keys_seed42_layer6.npz"

  # Link stats + datasets (needed for P matrix and data loading)
  export MODEL_NAME="${MODEL_NAME:-meta-llama/Meta-Llama-3-8B-Instruct}"
  echo "Running link_stats.sh..."
  bash scripts/link_stats.sh
  echo "Running link_dsets.sh..."
  bash scripts/link_dsets.sh
  uv run python scripts/patches/apply_all.py

  # Verify P is linked
  ls -la vendor/AlphaEdit/null_space_project.pt 2>/dev/null || echo "WARNING: P not linked by link_stats.sh"

  bash scripts/run_same_fact_damage.sh ${SEED:-42} stage2
