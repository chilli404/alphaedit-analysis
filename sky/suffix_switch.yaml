resources:
  accelerators: L40s:1
  cpus: 2+
  memory: 16+

workdir: .

file_mounts:
  ~/sky_workdir/.env: ./.env

setup: |
  set -euo pipefail
  cd ~/sky_workdir
  bash scripts/remote_setup.sh

run: |
  set -e
  export PATH="$HOME/.local/bin:$PATH"
  cd ~/sky_workdir

  export MODEL_NAME="${MODEL_NAME:-meta-llama/Meta-Llama-3-8B-Instruct}"
  export RESULT_ROOT="/s3-data/continual-learning/alphaedit/results"
  export CHECKPOINT_ROOT="/s3-data/continual-learning/alphaedit/checkpoints"

  echo "Linking stats and datasets..."
  bash scripts/link_stats.sh
  bash scripts/link_dsets.sh

  # Apply all vendor + baseline patches
  uv run python scripts/patches/apply_all.py
  uv run python -c "import nltk; nltk.download('punkt', quiet=True); nltk.download('punkt_tab', quiet=True)"

  # Verify datasets
  ls vendor/AlphaEdit/data/multi_counterfact.json || { echo "FATAL: MCF not linked"; exit 1; }

  SEED="${SEED:-42}"
  SUFFIX_TYPE="${SUFFIX_TYPE:-suffix_random}"

  if echo "$SUFFIX_TYPE" | grep -q "_late"; then
    START_BATCH=70
    SRC_BATCH=69
  else
    START_BATCH=50
    SRC_BATCH=49
  fi

  echo "═══════════════════════════════════════════════"
  echo "Suffix-Switch Rescue Experiment"
  echo "  Seed:         ${SEED}"
  echo "  Suffix type:  ${SUFFIX_TYPE}"
  echo "  Branch from:  batch_${SRC_BATCH} (${START_BATCH}00 edits)"
  echo "═══════════════════════════════════════════════"

  S3_CKPT="/s3-data/continual-learning/alphaedit/checkpoints"
  S3_RES="/s3-data/continual-learning/alphaedit/results"

  CKPT_SRC="${S3_CKPT}/matched_ordering/AlphaEdit/fb_high_exposure/seed${SEED}/batch_${SRC_BATCH}"
  CKPT_DST="${S3_CKPT}/matched_ordering/AlphaEdit/${SUFFIX_TYPE}/seed${SEED}"

  mkdir -p "${CKPT_DST}/batch_${SRC_BATCH}"
  cp "${CKPT_SRC}/model_weights.pt" "${CKPT_DST}/batch_${SRC_BATCH}/model_weights.pt"
  cp "${CKPT_SRC}/cache_c.pt" "${CKPT_DST}/batch_${SRC_BATCH}/cache_c.pt"
  cp "${CKPT_SRC}/metadata.json" "${CKPT_DST}/batch_${SRC_BATCH}/metadata.json" 2>/dev/null || true
  echo "  Copied checkpoint from fb_high_exposure batch_${SRC_BATCH}"

  STREAM_PATH="${S3_RES}/matched_ordering/orderings/${SUFFIX_TYPE}_seed${SEED}.json"
  echo "  Stream: ${STREAM_PATH}"

  uv run python src/runners/alphaedit_stream_runner.py \
    --seed "${SEED}" \
    --cuda_device 0 \
    --stream_length 10000 \
    --num_edits 100 \
    --save_interval 10 \
    --stream custom \
    --stream_name "${SUFFIX_TYPE}" \
    --stream_path "${STREAM_PATH}" \
    --checkpoint_base "${CKPT_DST}" \
    --start_from_batch "${START_BATCH}"
