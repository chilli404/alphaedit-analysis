resources:
  accelerators: L40s:1
  cpus: 4+
  memory: 28+

workdir: .

file_mounts:
  ~/sky_workdir/.env: ./.env

setup: |
  set -euo pipefail
  cd ~/sky_workdir
  bash scripts/remote_setup.sh

run: |
  set -e
  export PATH="$HOME/.local/bin:$PATH"
  cd ~/sky_workdir

  bash scripts/link_stats.sh
  bash scripts/link_dsets.sh
  uv run python scripts/patches/apply_all.py

  cd vendor/AlphaEdit
  PYTHONPATH=. uv run python ../../scripts/test_nse_validation.py
