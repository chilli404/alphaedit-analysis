resources:
  accelerators: L40s:1
  cpus: 2+
  memory: 16+

workdir: .

file_mounts:
  ~/sky_workdir/.env: ./.env
  ~/sky_workdir/scripts/remote_setup.sh: ./scripts/remote_setup.sh
  ~/sky_workdir/scripts/link_stats.sh: ./scripts/link_stats.sh
  ~/sky_workdir/scripts/link_dsets.sh: ./scripts/link_dsets.sh
  ~/sky_workdir/scripts/download_datasets.sh: ./scripts/download_datasets.sh
  ~/sky_workdir/src/util/model_download.py: ./src/util/model_download.py

setup: |
  set -euo pipefail
  cd ~/sky_workdir
  bash scripts/remote_setup.sh

run: |
  set -e
  export PATH="$HOME/.local/bin:$PATH"
  cd ~/sky_workdir

  export MODEL_NAME="${MODEL_NAME:-meta-llama/Meta-Llama-3-8B-Instruct}"

  S3_CKPT="/s3-data/continual-learning/alphaedit/checkpoints"
  S3_RES="/s3-data/continual-learning/alphaedit/results"
  export RESULT_ROOT="$S3_RES"

  bash scripts/link_stats.sh
  bash scripts/link_dsets.sh
  uv run python scripts/patches/apply_all.py

  echo "Running eval: ${ORDERING} seed ${SEED}"

  uv run python scripts/eval_matched_ordering.py \
    --seed "${SEED}" \
    --alg_name AlphaEdit \
    --ordering "${ORDERING}" \
    --checkpoints 99 \
    --num_edits 100 \
    --checkpoint_dir "${S3_CKPT}/matched_ordering/AlphaEdit/${ORDERING}/seed${SEED}" \
    --dataset_path "${S3_RES}/matched_ordering/orderings/${ORDERING}_seed${SEED}.json"
