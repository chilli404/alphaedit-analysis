# EvoEdit anchor evaluation: verify our eval protocol against published 98.29/91.21/63.91
#
# Downloads existing EvoEdit checkpoints from S3, evaluates with BOTH metrics
# (probability-preference + argmax) using eval_matched_ordering.py v2.
#
# Usage:
#   sky launch sky/eval_evoedit_anchor.yaml --cluster ae-evoedit-anchor -y --detach-run
#
# Evaluates checkpoints at 1K, 2K, 5K, 10K edits for fb_random0/seed42.

resources:
  accelerators: L40s:1
  cpus: 2+
  memory: 16+

workdir: .

file_mounts:
  ~/sky_workdir/.env: ./.env
  ~/sky_workdir/scripts/remote_setup.sh: ./scripts/remote_setup.sh
  ~/sky_workdir/scripts/link_stats.sh: ./scripts/link_stats.sh
  ~/sky_workdir/scripts/link_dsets.sh: ./scripts/link_dsets.sh
  ~/sky_workdir/scripts/download_datasets.sh: ./scripts/download_datasets.sh
  ~/sky_workdir/src/util/model_download.py: ./src/util/model_download.py

setup: |
  set -euo pipefail
  cd ~/sky_workdir
  bash scripts/remote_setup.sh

run: |
  set -e
  export PATH="$HOME/.local/bin:$PATH"
  cd ~/sky_workdir

  # Load env
  if [[ -f .env ]]; then set -a; source .env; set +a; fi

  export MODEL_NAME="${MODEL_NAME:-meta-llama/Meta-Llama-3-8B-Instruct}"
  export PYTORCH_CUDA_ALLOC_CONF="expandable_segments:True"
  export TOKENIZERS_PARALLELISM=false
  export RESULT_ROOT="${RESULT_ROOT:-/s3-data/continual-learning/alphaedit/results}"

  SEED="${SEED:-42}"
  ORDERING="${ORDERING:-fb_random0}"

  echo "================================================================"
  echo "EvoEdit Anchor Evaluation (Dual Metrics)"
  echo "  Model:    $MODEL_NAME"
  echo "  Seed:     $SEED"
  echo "  Ordering: $ORDERING"
  echo "================================================================"

  # Link stats and datasets
  bash scripts/link_stats.sh
  bash scripts/link_dsets.sh
  uv run python scripts/patches/apply_all.py

  # Stats symlinks for model name variants
  STATS_BASE="vendor/AlphaEdit/data/stats"
  _STATS_CANONICAL=""
  for _try in Llama3-8B Meta-Llama-3-8B-Instruct meta-llama-Meta-Llama-3-8B-Instruct; do
    if ls "${STATS_BASE}/${_try}/wikipedia_stats/"*.npz >/dev/null 2>&1; then
      _STATS_CANONICAL="$_try"; break
    fi
  done
  if [[ -n "$_STATS_CANONICAL" ]]; then
    for variant in Meta-Llama-3-8B Meta-Llama-3-8B-Instruct Llama3-8B \
      _s3-data_continual-learning_models_Meta-Llama-3-8B \
      meta-llama_Meta-Llama-3-8B-Instruct meta-llama-Meta-Llama-3-8B-Instruct; do
      [[ "$variant" == "$_STATS_CANONICAL" ]] && continue
      ln -sf "$_STATS_CANONICAL" "${STATS_BASE}/${variant}" 2>/dev/null || true
    done
  fi

  # NLTK
  uv run python -c "import nltk; [nltk.download(pkg, quiet=True) for pkg in ('punkt', 'punkt_tab')]" 2>/dev/null || true

  # Prepare: download EvoEdit checkpoints from S3 to local temp
  S3_CKPT_BASE="/s3-data/continual-learning/alphaedit/results/evoedit/${ORDERING}/seed${SEED}/10000edits/EvoEdit/run_000/checkpoints"
  STREAM_PATH="$RESULT_ROOT/matched_ordering/orderings/${ORDERING}_seed${SEED}.json"
  LOCAL_CKPT_BASE="/tmp/evoedit_ckpts"

  echo ""
  echo "Preparing checkpoints..."
  for edits in 1000 2000 3000 5000 7000 10000; do
    ckpt_name="edits_$(printf '%06d' $edits)"
    src="$S3_CKPT_BASE/$ckpt_name"
    dst="$LOCAL_CKPT_BASE/batch_$((edits / 100 - 1))"
    if [[ -f "$src/model_weights.pt" ]]; then
      mkdir -p "$dst"
      cp "$src/model_weights.pt" "$dst/model_weights.pt"
      echo "  ✓ $ckpt_name -> batch_$((edits / 100 - 1))"
    else
      echo "  ✗ $ckpt_name not found"
    fi
  done

  # Build checkpoint list (batch indices)
  CHECKPOINTS=""
  for edits in 1000 2000 3000 5000 7000 10000; do
    batch_idx=$((edits / 100 - 1))
    if [[ -f "$LOCAL_CKPT_BASE/batch_${batch_idx}/model_weights.pt" ]]; then
      CHECKPOINTS="$CHECKPOINTS $batch_idx"
    fi
  done
  CHECKPOINTS=$(echo $CHECKPOINTS | xargs)

  echo ""
  echo "Evaluating checkpoints: $CHECKPOINTS"
  echo "Stream: $STREAM_PATH"
  echo ""

  # Run dual-metric evaluation using eval_matched_ordering.py v2
  uv run python scripts/eval_matched_ordering.py \
      --seed "$SEED" \
      --alg_name "EvoEdit" \
      --ordering "$ORDERING" \
      --model_name "$MODEL_NAME" \
      --checkpoint_dir "$LOCAL_CKPT_BASE" \
      --checkpoints $CHECKPOINTS \
      --num_edits 100 \
      --dataset_path "$STREAM_PATH"

  echo ""
  echo "================================================================"
  echo "EvoEdit anchor evaluation complete!"
  echo ""
  echo "Published (10K, BS=100):  Eff=98.29  Gen=91.21  Spec=63.91"
  echo ""
  echo "Check results at:"
  echo "  $RESULT_ROOT/matched_ordering/EvoEdit/${ORDERING}/seed${SEED}/"
  echo "================================================================"
