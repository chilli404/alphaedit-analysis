# Unified test runner — CPU tests + GPU smoke tests.
#
# Usage:
#   sky launch sky/test.yaml --cluster test -y               # all tests
#   sky launch sky/test.yaml --cluster test \
#     --env SMOKE_FILTER="EvoEdit NSE RECT" -y               # baselines only
#   sky launch sky/test.yaml --cluster test \
#     --env SMOKE_FILTER="REVIVE" -y                         # REVIVE variants only
#   sky launch sky/test.yaml --cluster test \
#     --env SKIP_GPU=1 -y                                    # CPU tests only

resources:
  accelerators: L40s:1
  cpus: 4+
  memory: 16+

workdir: .

file_mounts:
  ~/sky_workdir/.env: ./.env

setup: |
  set -euo pipefail
  cd ~/sky_workdir
  bash scripts/remote_setup.sh

run: |
  set -euo pipefail
  cd ~/sky_workdir
  set -a && source ~/.env 2>/dev/null || true && set +a
  export RESULT_ROOT="/s3-data/continual-learning/alphaedit/results/_smoke_test"
  export CHECKPOINT_ROOT="/s3-data/continual-learning/alphaedit/checkpoints/_smoke_test"

  # Data + patches
  bash scripts/link_stats.sh
  bash scripts/link_dsets.sh
  uv run python scripts/patches/apply_all.py

  # CPU tests (fast — catches code issues before GPU work)
  # Run only our test files (skip legacy tests that import unavailable modules)
  echo "=== CPU Tests ==="
  uv run pytest \
    tests/test_path_isolation.py \
    tests/test_source_integrity.py \
    tests/test_all_runners.py \
    tests/test_shared_infrastructure.py \
    tests/test_evaluate_harness.py \
    tests/test_patches.py \
    tests/test_checkpoint_dir_dedup.py \
    tests/test_runner_logging.py \
    tests/test_model_names.py \
    tests/test_cli.py \
    tests/test_migrate_seeded_runner.py \
    tests/test_runner_migrations.py \
    tests/test_measurement_runners.py \
    tests/test_legacy_runners.py \
    tests/test_legacy_runner_migration.py \
    tests/test_algorithm_hooks.py \
    tests/test_measurement_harness.py \
    tests/test_skypilot_yamls.py \
    tests/test_scientific_integrity.py \
    tests/test_revision_code.py \
    --tb=short -q

  # GPU smoke test (unless SKIP_GPU=1)
  if [[ "${SKIP_GPU:-}" != "1" ]]; then
    echo ""
    echo "=== GPU Smoke Test ==="
    bash tests/test_smoke_all_algorithms.sh --skypilot ${SMOKE_FILTER:-}
  else
    echo "=== Skipping GPU tests (SKIP_GPU=1) ==="
  fi

  echo ""
  echo "=== All tests complete ==="
