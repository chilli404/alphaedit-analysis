# Generic experiment runner — ONE YAML for ALL experiments.
#
# Uses the unified CLI (python -m src run) to dispatch to any algorithm.
# Pass experiment parameters as --env vars.
#
# Usage:
#   sky launch sky/run.yaml --cluster ae-s42 \
#     --env METHOD=alphaedit,SEED=42,DATASET_LIMIT=2000 -y
#
#   sky launch sky/run.yaml --cluster revive-fbhi-s42 \
#     --env METHOD=revive+memit,SEED=42,ORDERING=fb_high_exposure -y
#
#   sky launch sky/run.yaml --cluster nse-s2024 \
#     --env METHOD=nse,SEED=2024,ORDERING=fb_random0 -y
#
# All 14 methods: alphaedit, memit, memit-seq, revive+memit, revive+alphaedit,
#   revive+nse, revive+rect, evoedit, nse, rect, pathguard, poly2-hybrid,
#   poly2-editor, memit-seq-poly2

resources:
  accelerators: L40s:1
  cpus: 4+
  memory: 28+

workdir: .

file_mounts:
  ~/sky_workdir/.env: ./.env

setup: |
  set -euo pipefail
  cd ~/sky_workdir
  bash scripts/remote_setup.sh

run: |
  set -e
  cd ~/sky_workdir

  # Source environment
  set -a && source ~/.env 2>/dev/null || true && set +a
  export RESULT_ROOT="${RESULT_ROOT:-/s3-data/continual-learning/alphaedit/results}"
  export CHECKPOINT_ROOT="${CHECKPOINT_ROOT:-/s3-data/continual-learning/alphaedit/checkpoints}"
  export PYTORCH_CUDA_ALLOC_CONF="expandable_segments:True"

  # Data + patches
  bash scripts/link_stats.sh
  bash scripts/link_dsets.sh
  uv run python scripts/patches/apply_all.py

  # NLTK data (needed for some eval)
  uv run python -c "import nltk; [nltk.download(pkg, quiet=True) for pkg in ('punkt', 'punkt_tab')]" 2>/dev/null || true

  echo "=== Running: METHOD=${METHOD:-?} SEED=${SEED:-?} ==="
  nvidia-smi --query-gpu=name,memory.total --format=csv,noheader 2>/dev/null || true

  # Dispatch via unified CLI
  uv run python -m src run \
    --method "${METHOD:?Set METHOD env var (e.g. alphaedit, revive+memit, nse)}" \
    --seed "${SEED:?Set SEED env var (e.g. 42)}" \
    ${ORDERING:+--ordering "$ORDERING"} \
    ${NUM_EDITS:+--num-edits "$NUM_EDITS"} \
    ${DATASET_LIMIT:+--dataset-limit "$DATASET_LIMIT"} \
    ${EXTRA_ARGS:-}

  echo "=== Complete ==="
