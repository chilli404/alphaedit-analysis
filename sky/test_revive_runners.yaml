# GPU smoke test: REVIVE variants (REVIVE+MEMIT, +AlphaEdit, +NSE, +RECT)
# Launch: sky launch sky/test_revive_runners.yaml --cluster test-revive --detach-run -y
# ~10 min on L40S

resources:
  accelerators: L40s:1
  cpus: 4+
  memory: 16+

workdir: .

file_mounts:
  ~/sky_workdir/.env: ./.env

setup: |
  set -euo pipefail
  cd ~/sky_workdir
  bash scripts/remote_setup.sh

run: |
  set -euo pipefail
  cd ~/sky_workdir
  set -a && source ~/.env 2>/dev/null || source ~/sky_workdir/.env && set +a
  export RESULT_ROOT="/s3-data/continual-learning/alphaedit/results/_smoke_test"
  export CHECKPOINT_ROOT="/s3-data/continual-learning/alphaedit/checkpoints/_smoke_test"

  bash scripts/link_stats.sh
  bash scripts/link_dsets.sh
  uv run python scripts/patches/apply_all.py

  echo "=== CPU tests ==="
  uv run pytest tests/test_path_isolation.py tests/test_source_integrity.py \
      tests/test_patches.py --tb=short -q

  echo ""
  echo "=== GPU: REVIVE variants ==="
  bash tests/test_smoke_all_algorithms.sh --skypilot REVIVE
